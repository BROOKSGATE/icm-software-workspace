<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SourceLink{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #f6f6f4; line-height: 1.5; }
    header, main, footer { max-width: 640px; margin: 0 auto; padding: 12px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    header a { color: #1a1a1a; text-decoration: none; font-weight: 700; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
    label { display: block; font-weight: 600; margin-top: 8px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #999; border-radius: 6px; }
    button, .button { display: inline-block; margin-top: 10px; padding: 10px 16px; font-size: 16px; border: 0; border-radius: 6px; background: #1f5f4a; color: #fff; text-decoration: none; cursor: pointer; }
    button.secondary { background: #6b6b6b; }
    button:focus, a:focus, input:focus, textarea:focus { outline: 3px solid #e0a800; outline-offset: 2px; }
    .msg { padding: 8px 12px; border-radius: 6px; margin: 8px 0; background: #e7f3ee; }
    .msg.error, .msg.warning { background: #fdecea; }
    .muted { color: #555; font-size: 14px; }
    ul.plain { list-style: none; padding: 0; }
    .chat { max-height: 300px; overflow-y: auto; }
    footer { font-size: 13px; color: #555; }
  </style>
</head>
<body>
<header>
  <a href="{% url 'home' %}">SourceLink</a>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary" type="submit">Log out</button></form>
  {% endif %}
</header>
<main>
  {% for message in messages %}<p class="msg {{ message.tags }}" role="status">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
<footer>Test mode: no real money moves. <a href="https://www.exchangerate-api.com">Rates by Exchange Rate API</a></footer>
</body>
</html>
